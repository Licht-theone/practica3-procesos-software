<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="pageTitle">Autenticación</ui:define>
    <ui:define name="title">Acceso Restringido - Autenticación</ui:define>

    <ui:define name="content">
        <p>Introduzca sus credenciales de gerente para acceder:</p>

        <form name="loginForm" action="j_security_check" method="post">
            <table class="form-grid">
                <tr>
                    <td><strong>Usuario:</strong></td>
                    <td><input type="text" name="j_username" size="25" /></td>
                </tr>
                <tr>
                    <td><strong>Contraseña:</strong></td>
                    <td><input type="password" name="j_password" size="25" /></td>
                </tr>
            </table>
            <div class="actions">
                <input type="submit" value="Entrar" />
                <input type="reset" value="Limpiar" />
                <h:button value="Volver al inicio" outcome="index.xhtml" />
            </div>
        </form>
    </ui:define>
</ui:composition>
</html>
