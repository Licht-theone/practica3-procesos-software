<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="pageTitle">Reservas</ui:define>
    <ui:define name="title">Reservas</ui:define>

    <ui:define name="content">
        <h:form id="gestionReservasForm">
            <h:messages globalOnly="true" errorClass="error-msg" infoClass="info-msg" />

            <h:panelGrid columns="3" styleClass="form-grid">
                <h:outputLabel for="codigoReserva" value="Código de la Reserva:" />
                <h:inputText id="codigoReserva" value="#{gestionReservasBean.idReserva}"
                             required="true" requiredMessage="Debe introducir el código de la reserva"
                             converterMessage="El código debe ser numérico" size="15" />
                <h:message for="codigoReserva" styleClass="error-msg" />

                <h:outputLabel for="dniCliente" value="DNI del Cliente:" />
                <h:inputText id="dniCliente" value="#{gestionReservasBean.dni}"
                             required="true" requiredMessage="Debe introducir su DNI" size="15" />
                <h:message for="dniCliente" styleClass="error-msg" />
            </h:panelGrid>

            <div class="actions">
                <h:commandButton id="btnConsultarReserva" value="Consultar Reserva"
                                 action="#{gestionReservasBean.consultarReserva}" />
                <h:commandButton id="btnCancelarReserva" value="Cancelar Reserva"
                                 action="#{gestionReservasBean.cancelarReserva}" />
                <h:button id="btnInicio" value="Inicio" outcome="index.xhtml" />
            </div>

            <h:panelGroup rendered="#{gestionReservasBean.reservaEncontrada != null}">
                <h2>Detalles de la Reserva</h2>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="ID Reserva:" />
                    <h:outputText value="#{gestionReservasBean.reservaEncontrada.id}" />

                    <h:outputLabel value="Hotel:" />
                    <h:outputText value="#{gestionReservasBean.reservaEncontrada.hotel.nombre}" />

                    <h:outputLabel value="Fecha Entrada:" />
                    <h:outputText value="#{gestionReservasBean.reservaEncontrada.fechaEntrada}" />

                    <h:outputLabel value="Fecha Salida:" />
                    <h:outputText value="#{gestionReservasBean.reservaEncontrada.fechaSalida}" />

                    <h:outputLabel value="Cliente:" />
                    <h:outputText value="#{gestionReservasBean.reservaEncontrada.cliente.nombre} #{gestionReservasBean.reservaEncontrada.cliente.primerApellido}" />

                    <h:outputLabel value="Importe (€):" />
                    <h:outputText value="#{gestionReservasBean.reservaEncontrada.importe}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                    </h:outputText>
                </h:panelGrid>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
</html>
