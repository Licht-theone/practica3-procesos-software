<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="pageTitle">Central de Reservas</ui:define>
    <ui:define name="title">Central de Reservas</ui:define>

    <ui:define name="content">
        <h:form id="busquedaForm">
            <h:messages globalOnly="true" styleClass="error-msg" />

            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel for="nombreHotel" value="Nombre del Hotel:" />
                <h:inputText id="nombreHotel" value="#{reservaBean.nombreHotel}" size="30" />

                <h:outputLabel for="localidad" value="Localidad:" />
                <h:inputText id="localidad" value="#{reservaBean.localidad}" size="30" />
            </h:panelGrid>

            <div class="actions">
                <h:commandButton id="btnBuscar" value="Buscar" action="#{reservaBean.buscarHoteles}" />
                <h:button id="btnGestionarReservas" value="Gestionar Reservas" outcome="gestionarReservas.xhtml" />
                <h:button id="btnAccesoGerente" value="Acceso Gerente" outcome="gerente.xhtml" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
