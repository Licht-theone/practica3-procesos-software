<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="pageTitle">Gestión de Hoteles - Gerente</ui:define>
    <ui:define name="title">Zona de Gerente</ui:define>

    <ui:define name="content">
        <p>
            Bienvenido, <strong><h:outputText value="#{gerenteBean.usuarioAutenticado}" /></strong>.
        </p>
        <p>
            Acceso autorizado únicamente para usuarios con el rol <strong>GERENTE</strong>
            (gestión de hoteles y consulta de reservas por hotel).
        </p>

        <h:form id="gerenteForm">
            <div class="actions">
                <h:commandButton id="btnCerrarSesion" value="Cerrar sesión" action="#{gerenteBean.cerrarSesion}" />
                <h:button id="btnInicio" value="Inicio" outcome="index.xhtml" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
