<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="pageTitle">Confirmación Reserva</ui:define>
    <ui:define name="title">Confirmación Reserva</ui:define>

    <ui:define name="content">
        <p class="info-msg">¡Su reserva se ha realizado correctamente!</p>

        <h:panelGrid columns="2" styleClass="form-grid">
            <h:outputLabel value="Número de Reserva:" />
            <h:outputText id="numeroReserva" value="#{reservaBean.reservaConfirmada.id}" />

            <h:outputLabel value="Hotel:" />
            <h:outputText value="#{reservaBean.reservaConfirmada.hotel.nombre}" />

            <h:outputLabel value="Fecha de Entrada:" />
            <h:outputText value="#{reservaBean.reservaConfirmada.fechaEntrada}" />

            <h:outputLabel value="Fecha de Salida:" />
            <h:outputText value="#{reservaBean.reservaConfirmada.fechaSalida}" />

            <h:outputLabel value="Cliente:" />
            <h:outputText value="#{reservaBean.reservaConfirmada.cliente.nombre} #{reservaBean.reservaConfirmada.cliente.primerApellido}" />

            <h:outputLabel value="DNI:" />
            <h:outputText value="#{reservaBean.reservaConfirmada.cliente.dni}" />

            <h:outputLabel value="Importe Total:" />
            <h:outputText value="#{reservaBean.importeTotal}">
                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
            </h:outputText>
        </h:panelGrid>

        <h:form id="confirmacionForm">
            <div class="actions">
                <h:commandButton id="btnCerrar" value="Cerrar" action="#{reservaBean.cerrarConfirmacion}" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
